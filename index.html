<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaevesBeauty — Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #4b176f, #873bb0 55%, #bd72d5);
    }
    main { max-width: 900px; }
    .brand {
      margin: 0 0 20px;
      color: #ffd9ef;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 12vw, 8rem);
      line-height: .95;
      letter-spacing: .04em;
      text-shadow: 0 5px 24px rgba(30, 0, 50, .3);
    }
    .name {
      margin: 24px 0 0;
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 700;
    }
    .tagline { margin-top: 20px; font-size: 1.1rem; color: #f6e9ff; }
  </style>
</head>
<body>
  <main>
    <p class="brand">MaevesBeauty</p>
    <h1>Coming<br>Soon</h1>
    <p class="name">MaevesBeauty</p>
    <p class="tagline">Makeup for your special moments.</p>
  </main>
</body>
</html>
