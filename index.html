<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maeves Beauty — Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: #fff;
      font-family: Arial, sans-serif;
      background-color: #351052;
      background-image:
        radial-gradient(2px 2px at 12% 18%, #fff 99%, transparent),
        radial-gradient(1.5px 1.5px at 78% 24%, #fff 99%, transparent),
        radial-gradient(2px 2px at 42% 68%, rgba(255,255,255,.9) 99%, transparent),
        radial-gradient(1px 1px at 88% 82%, #fff 99%, transparent),
        radial-gradient(1.5px 1.5px at 22% 88%, rgba(255,255,255,.85) 99%, transparent),
        linear-gradient(135deg, #34104f, #64218b 55%, #3b145f);
      background-size: 260px 240px, 310px 280px, 360px 330px, 230px 250px, 320px 300px, cover;
      background-attachment: fixed;
    }
    .banner {
      padding: 23px 16px;
      text-align: center;
      background: linear-gradient(100deg, #e75ca8, #9d49bd 55%, #e75ca8);
      background-size: 200% 100%;
      box-shadow: 0 5px 28px rgba(255, 125, 220, .35);
      animation: shimmer 7s ease-in-out infinite alternate;
    }
    .banner h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.8rem);
      letter-spacing: .16em;
      text-shadow: 0 0 12px rgba(255,255,255,.75), 0 3px 12px rgba(48,0,65,.35);
    }
    .banner h1 span { color: #fff2fc; padding: 0 .35em; }
    section {
      min-height: calc(100vh - 82px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 22px;
      text-align: center;
    }
    .hero h2 {
      margin: 0;
      font-size: clamp(3.6rem, 12vw, 8rem);
      line-height: .95;
      text-shadow: 0 5px 26px rgba(15,0,35,.42);
    }
    .hero p { margin: 24px 0 32px; color: #f8eaff; font-size: clamp(1rem, 3vw, 1.25rem); }
    .next, .back {
      display: inline-block;
      padding: 15px 34px;
      border: 2px solid rgba(255,255,255,.85);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(100deg, #e75ca8, #9847bd);
      box-shadow: 0 0 22px rgba(247,143,226,.55);
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    .next:hover, .back:hover { transform: translateY(-3px); box-shadow: 0 0 30px rgba(255,220,250,.75); }
    #start { scroll-margin-top: 16px; }
    .welcome {
      max-width: 720px;
      padding: clamp(28px, 7vw, 60px);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 28px;
      background: rgba(42, 11, 69, .62);
      box-shadow: 0 0 50px rgba(232,121,224,.2);
      backdrop-filter: blur(5px);
    }
    .welcome h2 { margin: 0 0 18px; font-size: clamp(2.2rem, 7vw, 4.5rem); }
    .welcome p { margin: 0 0 30px; color: #f8eaff; font-size: 1.15rem; line-height: 1.7; }
    @keyframes shimmer { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="banner">
    <h1><span>✦</span> MAEVES BEAUTY <span>✦</span></h1>
  </header>
  <main>
    <section class="hero" aria-labelledby="coming-soon">
      <h2 id="coming-soon">Coming<br>Soon</h2>
      <p>Makeup for your special moments.</p>
      <a class="next" href="#start">Next <span aria-hidden="true">↓</span></a>
    </section>
    <section id="start" aria-labelledby="start-heading">
      <div class="welcome">
        <h2 id="start-heading">Let’s start building your glam.</h2>
        <p>Your beauty journey starts here. We’ll add makeup services, photos and videos, and easy appointment booking next.</p>
        <a class="back" href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;">Back to top</a>
      </div>
    </section>
  </main>
</body>
</html>
